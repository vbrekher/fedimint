name: Temporary walletv2 DB wiring validation
on: [push]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Apply DB-backed regression test
        run: |
          python3 .github/tmp_review_fix_9123.py
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
      - name: Walletv2 server tests
        run: cargo test -p fedimint-walletv2-server
      - name: Walletv2 server clippy
        run: cargo clippy -p fedimint-walletv2-server --all-targets --no-deps -- -D warnings
      - name: Commit verified source
        run: |
          git rm .github/tmp_review_fix_9123.py .github/workflows/tmp-review-fix-9123-db-wiring.yml
          git add modules/fedimint-walletv2-server/src/lib.rs modules/fedimint-walletv2-server/Cargo.toml
          git diff --cached --check
          git config user.name 'Valentin'
          git config user.email '6142607+vbrekher@users.noreply.github.com'
          git commit -m 'walletv2: test pending limit through database'
          git push origin HEAD:review-fix/9123-db-wiring-20260919
